# Per-PR preview apps: ephemeral SQLite (container FS, no volume mount),
# smaller VM, health check. Prod config is fly.toml.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SEASONS = ""

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb" # pandas ETL peaks above 256MB; 1GB (prod) is overkill for previews
