services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/fpl.db
      SEASONS: ""            # e.g. "2025-2026,2026-2027" to limit
      REFRESH_HOUR: "8,18"
      REFRESH_MINUTE: "5"
      ADMIN_TOKEN: ""
    volumes:
      - fpldata:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  fpldata:
