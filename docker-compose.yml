services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/fpl.db
      SEASONS: ""            # e.g. "2025-2026,2026-2027" to limit
      REFRESH_HOUR: "8,18"
      REFRESH_MINUTE: "5"
      ADMIN_TOKEN: ""
    volumes:
      - fpldata:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # server components fetch inside the container (compose network)...
      API_URL: http://api:8000
      # ...browser-side code must reach the API via the HOST
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # behind a TLS-inspecting proxy (Zscaler etc.): extract the proxy root
      # CA to .dev-certs/ and set NODE_EXTRA_CA_CERTS in .env (see CONTRIBUTING)
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    volumes:
      - ./.dev-certs:/etc/ssl/extra:ro
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fpldata:
