name: Preview environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# one deploy at a time per PR; a new push cancels the in-flight one
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # no forked PRs: the Fly token must never leave the org
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      APP: fpl-core-api-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create preview app if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status -a "$APP" >/dev/null 2>&1 || flyctl apps create "$APP" --org personal
          # one machine: preview SQLite lives in the container, so a second
          # (HA) machine would hold a DIFFERENT database and round-robin
          # proxying would flake the smoke gate
          flyctl scale count 1 --yes -a "$APP" || true

      - name: Deploy preview
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a "$APP" -c fly.preview.toml

      - name: Smoke gate
        env:
          URL: https://${{ env.APP }}.fly.dev
        run: |
          set -e
          echo "== waiting for app =="
          for i in $(seq 1 60); do
            curl -sf "$URL/api/health" >/dev/null && break
            sleep 5
          done
          curl -sf "$URL/api/health" || { echo "app never came up"; exit 1; }

          echo "== waiting for bootstrap ingestion (all 3 seasons, ~2 min) =="
          # /api/seasons reports data mid-load; wait for the run to say success.
          # Previews set no ADMIN_TOKEN, so /api/admin/ingestions is open.
          status=""
          for i in $(seq 1 90); do
            status=$(curl -sf "$URL/api/admin/ingestions?limit=1" \
              | jq -r '.ingestions[0].status // empty' 2>/dev/null || true)
            [ "$status" = "success" ] && break
            sleep 5
          done
          [ "$status" = "success" ] \
            || { echo "ingestion never succeeded (last status: ${status:-unknown})"; exit 1; }
          echo "ingestion succeeded"

          echo "== endpoint smoke =="
          fail=0
          for ep in \
            "/api/players?limit=1" \
            "/api/players?limit=1&season=2024-2025" \
            "/api/differentials?limit=1" \
            "/api/defcon?limit=1" \
            "/api/rotation-risk?days=4" \
            "/api/search/players?q=ha" \
            "/api/matches?finished=true&limit=1"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$ep")
            echo "$code $ep"
            [ "$code" = 200 ] || fail=1
          done
          [ "$fail" = 0 ] || exit 1
          echo "smoke gate: all endpoints 200"

      - name: Deploy frontend preview pointed at the preview backend
        if: vars.VERCEL_FRONTEND_PREVIEWS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          API: https://${{ env.APP }}.fly.dev
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          NEXT_PUBLIC_API_URL="$API" npx vercel build --token="$VERCEL_TOKEN"
          url=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "FRONTEND_URL=$url" >> "$GITHUB_ENV"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://${{ env.APP }}.fly.dev"
          FRONTEND="${{ env.FRONTEND_URL }}"
          BODY=$(cat <<EOF
          ## Preview environment 🚧
          **Backend:** $URL (interactive docs: $URL/docs) — seeded with all 3 seasons; smoke gate passed.
          EOF
          )
          if [ -n "$FRONTEND" ]; then
            BODY="$BODY
          **Frontend:** $FRONTEND — built against the preview backend above."
          else
            BODY="$BODY
          The Vercel preview below still uses the prod API; backend changes are testable via the URL above."
          fi
          BODY="$BODY
          App is destroyed automatically when this PR closes."
          gh pr comment ${{ github.event.pull_request.number }} --edit-last \
            --body "$BODY" 2>/dev/null \
            || gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"

  destroy:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy preview app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: fpl-core-api-pr-${{ github.event.pull_request.number }}
        run: flyctl apps destroy "$APP" --yes || true
