<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Copy FPL token</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" width="20" height="20" />
      <h1>FPL token</h1>
    </header>
    <p id="status" class="status" role="status">Looking for your token…</p>
    <p id="meta" class="meta"></p>
    <div class="actions">
      <button id="copy" type="button" disabled>Copy token</button>
      <button id="open-fpl" type="button" class="secondary" hidden>Open FPL</button>
    </div>
    <p class="hint">
      Paste it into <a id="app-link" href="#" target="_blank" rel="noopener">FPL Core → My Team</a>.
      Treat it like a password: it lets anyone act as you on FPL until it expires.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
